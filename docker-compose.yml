services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Veritabanı
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: football_simulator_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: football_simulator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_simulator"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Redis Mesaj Kuyruğu (Broker & Result Backend)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: football_simulator_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. FastAPI REST API Servisi
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: football_simulator_api
    restart: always
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/football_simulator
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - APP_NAME=Football Simulator API
      - APP_VERSION=1.0.0
      - DEBUG=True
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # 4. Celery Worker (Asenkron Simülasyon İşçisi)
  # -------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: football_simulator_worker
    restart: always
    command: celery -A src.worker.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/football_simulator
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
